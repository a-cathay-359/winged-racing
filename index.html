<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>3D 竞速 · WebGL 赛车</title>
<style>
  * {
    -webkit-user-select: none;
    -moz-user-select: none;
    -ms-user-select: none;
    user-select: none;
    -webkit-touch-callout: none;
    -webkit-tap-highlight-color: transparent;
  }
  html, body {
    margin: 0;
    height: 100%;
    overflow: hidden;
    background: #0b0e13;
    color: #fff;
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    touch-action: none;
    overscroll-behavior: none;
    position: fixed;
    inset: 0;
  }
  #gl { display: block; position: fixed; inset: 0; touch-action: none; }

  #hud { position: fixed; inset: 0; pointer-events: none; z-index: 2; }
  .panel {
    position: absolute;
    background: rgba(10,14,20,.55);
    border: 1px solid rgba(120,180,255,.22);
    border-radius: 14px;
    padding: 10px 14px;
    backdrop-filter: blur(8px);
  }
  #info { top: 16px; left: 16px; font-size: 13px; line-height: 1.75; min-width: 132px; }
  #info .row { display: flex; justify-content: space-between; gap: 14px; }
  #info .k { color: #8fa6c4; }
  #info .v { font-weight: 700; font-variant-numeric: tabular-nums; }

  #speedBox { right: 16px; bottom: 20px; text-align: right; padding: 10px 20px 12px; }
  #speedVal {
    font-size: 46px; font-weight: 800; line-height: 1; font-variant-numeric: tabular-nums;
    background: linear-gradient(180deg,#fff,#7fc4ff);
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  #speedUnit { font-size: 11px; color: #8fa6c4; letter-spacing: 3px; }
  #gearTag { font-size: 11px; color: #ffd23f; font-weight: 700; letter-spacing: 2px; height: 13px; }

  #nitroLabel { position: absolute; left: 18px; bottom: 44px; font-size: 11px; color: #7dd3fc; letter-spacing: 3px; }
  #nitroWrap {
    position: absolute; left: 16px; bottom: 26px; width: 186px; height: 9px; border-radius: 6px;
    background: rgba(255,255,255,.1); overflow: hidden; border: 1px solid rgba(120,180,255,.25);
  }
  #nitroFill { height: 100%; width: 100%; border-radius: 6px; background: linear-gradient(90deg,#22d3ee,#3b82f6); transition: width .08s linear; }

  #minimap {
    position: absolute; right: 16px; top: 16px; width: 152px; height: 152px;
    background: rgba(10,14,20,.5); border: 1px solid rgba(120,180,255,.22);
    border-radius: 12px; backdrop-filter: blur(8px);
  }

  #driftTag {
    position: absolute; left: 50%; top: 24%; transform: translateX(-50%) scale(.85); opacity: 0;
    font-size: 32px; font-weight: 900; letter-spacing: 7px; color: #ffd23f;
    text-shadow: 0 0 26px rgba(255,180,0,.95); transition: opacity .1s, transform .1s;
  }
  #driftTag.on { opacity: 1; transform: translateX(-50%) scale(1); }

  #warn {
    position: absolute; left: 50%; top: 14%; transform: translateX(-50%); opacity: 0; transition: opacity .2s;
    font-size: 20px; font-weight: 900; letter-spacing: 5px; color: #ff5252; text-shadow: 0 0 20px #f00;
  }
  #vignette {
    position: absolute; inset: 0; pointer-events: none; opacity: 0; transition: opacity .25s;
    box-shadow: inset 0 0 140px 40px rgba(255,40,40,.55);
  }

  #overlay {
    position: fixed; inset: 0; z-index: 10; display: flex; flex-direction: column;
    align-items: center; justify-content: center; text-align: center; padding: 24px;
    background: radial-gradient(circle at 50% 38%, rgba(12,26,44,.88), rgba(4,8,14,.97));
    backdrop-filter: blur(6px);
  }
  #overlay.hide { display: none; }
  #overlay h1 {
    margin: 0 0 4px; font-size: clamp(30px,6.5vw,54px); letter-spacing: 10px;
    background: linear-gradient(180deg,#fff,#4fa8ff);
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  #overlay .sub { color: #7f97b5; font-size: 12px; letter-spacing: 4px; margin-bottom: 24px; }
  #overlay .keys {
    display: grid; grid-template-columns: auto auto; gap: 8px 20px;
    font-size: 13px; color: #a9bfd8; margin-bottom: 26px; text-align: left;
  }
  #overlay .keys b {
    color: #fff; background: rgba(255,255,255,.08); border: 1px solid rgba(255,255,255,.16);
    border-radius: 6px; padding: 2px 8px; font-weight: 600; font-size: 12px;
    display: inline-block; min-width: 20px; text-align: center;
  }
  #startBtn {
    pointer-events: auto; border: 0; border-radius: 999px; padding: 15px 54px;
    font-size: 18px; font-weight: 800; letter-spacing: 4px; color: #04121f;
    background: linear-gradient(180deg,#8fdcff,#2f9bff); cursor: pointer;
    box-shadow: 0 8px 28px rgba(47,155,255,.5); transition: transform .1s;
    touch-action: none;
  }
  #startBtn:active { transform: translateY(2px) scale(.99); }
  #result { display: none; font-size: 15px; color: #cfe3ff; line-height: 2.1; margin-bottom: 24px; }
  #result b { color: #ffd23f; }

  #touchPad { display: none; }
  @media (pointer: coarse) { #touchPad { display: block; } }

  .tbtn {
    position: absolute;
    border-radius: 50%;
    background: rgba(255,255,255,.09);
    border: 1.5px solid rgba(255,255,255,.22);
    display: flex; align-items: center; justify-content: center;
    font-size: 22px; color: #cfe3ff; font-weight: 700;
    backdrop-filter: blur(4px);
    pointer-events: auto;
    touch-action: none;
    -webkit-user-select: none; user-select: none;
    -webkit-touch-callout: none;
  }
  .tbtn.active { background: rgba(120,200,255,.35); border-color: rgba(160,220,255,.7); }
  .tbtn.disabled { opacity: .32; filter: grayscale(1); }

  #tLeft  { left: 16px;  bottom: 100px; width: 70px; height: 70px; }
  #tRight { left: 100px; bottom: 100px; width: 70px; height: 70px; }

  #tGas   { right: 16px;  bottom: 100px; width: 78px; height: 78px; font-size: 15px; }
  #tBrake { right: 104px; bottom: 100px; width: 64px; height: 64px; font-size: 15px; }

  #tDrift {
    right: 14px; top: 182px; width: 76px; height: 76px;
    font-size: 13px; letter-spacing: 1px;
    border-color: rgba(255,210,63,.5);
    color: #ffd23f;
  }
  #tDrift.active { background: rgba(255,210,63,.35); border-color: rgba(255,225,120,.9); }

  #tNitro {
    right: 100px; top: 188px; width: 64px; height: 64px;
    font-size: 12px; letter-spacing: 1px;
    border-color: rgba(80,200,255,.5);
    color: #7dd3fc;
  }
  #tNitro.active { background: rgba(60,180,255,.4); border-color: rgba(140,225,255,.95); }
</style>
</head>
<body>
<canvas id="gl"></canvas>

<div id="hud">
  <div id="info" class="panel">
    <div class="row"><span class="k">圈数</span><span class="v" id="lapTxt">1/3</span></div>
    <div class="row"><span class="k">名次</span><span class="v" id="posTxt">1/4</span></div>
    <div class="row"><span class="k">本圈</span><span class="v" id="curTxt">0.00</span></div>
    <div class="row"><span class="k">最佳</span><span class="v" id="bestTxt">--</span></div>
  </div>
  <canvas id="minimap" width="304" height="304"></canvas>
  <div id="speedBox" class="panel">
    <div id="gearTag"></div>
    <div id="speedVal">0</div>
    <div id="speedUnit">KM/H</div>
  </div>
  <div id="nitroLabel">NITRO</div>
  <div id="nitroWrap"><div id="nitroFill"></div></div>
  <div id="driftTag">DRIFT</div>
  <div id="warn">冲出赛道</div>
  <div id="vignette"></div>
</div>

<div id="touchPad">
  <div class="tbtn" id="tLeft">◀</div>
  <div class="tbtn" id="tRight">▶</div>
  <div class="tbtn" id="tGas">油门</div>
  <div class="tbtn" id="tBrake">刹车</div>
  <div class="tbtn" id="tDrift">漂移</div>
  <div class="tbtn" id="tNitro">氮气</div>
</div>

<div id="overlay">
  <h1>极 速 竞 速</h1>
  <div class="sub">WEBGL · 3 LAPS</div>
  <div id="result"></div>
  <div class="keys">
    <span><b>W</b> / <b>↑</b> 油门</span><span><b>S</b> / <b>↓</b> 刹车</span>
    <span><b>A</b> <b>D</b> / <b>←</b> <b>→</b> 方向</span><span><b>Space</b> 漂移</span>
    <span><b>Shift</b> 氮气</span><span><b>R</b> 重新开始</span>
  </div>
  <button id="startBtn">开始比赛</button>
</div>

<script src="https://unpkg.com/three@0.155.0/build/three.min.js"></script>
<script>
if (!window.THREE) {
  document.body.innerHTML = '<div style="padding:50px;font-size:18px;color:#fff">three.js 加载失败，请检查网络后刷新页面。</div>';
}
</script>
<script>
(function () {
'use strict';

// ============================================================
//  禁止长按菜单 / 右键菜单
// ============================================================
document.addEventListener('contextmenu', e => e.preventDefault());
document.addEventListener('selectstart', e => e.preventDefault());
document.addEventListener('dragstart', e => e.preventDefault());
document.addEventListener('gesturestart', e => e.preventDefault());

// ============================================================
//  基础渲染
// ============================================================
const glCanvas = document.getElementById('gl');
const renderer = new THREE.WebGLRenderer({ canvas: glCanvas, antialias: true, powerPreference: 'high-performance' });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.useLegacyLights = false;

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x8fc4ea);
scene.fog = new THREE.Fog(0x8fc4ea, 280, 680);

const camera = new THREE.PerspectiveCamera(64, innerWidth / innerHeight, 0.1, 1600);
camera.position.set(0, 12, -25);

scene.add(new THREE.HemisphereLight(0xd9ecff, 0x3a4a35, 1.7));
const sun = new THREE.DirectionalLight(0xfff4e0, 2.6);
sun.castShadow = true;
sun.shadow.mapSize.set(1024, 1024);
sun.shadow.camera.left = -75; sun.shadow.camera.right = 75;
sun.shadow.camera.top = 75; sun.shadow.camera.bottom = -75;
sun.shadow.camera.near = 1; sun.shadow.camera.far = 300;
sun.shadow.bias = -0.0016;
scene.add(sun, sun.target);

// ============================================================
//  赛道生成
// ============================================================
const UP = new THREE.Vector3(0, 1, 0);
const HALF_W = 11;
const SEG = 1000;

const controlPts = [];
const CN = 18;
for (let i = 0; i < CN; i++) {
  const a = (i / CN) * Math.PI * 2;
  const r = 230 + 55 * Math.sin(a * 3) + 30 * Math.cos(a * 2 + 0.9);
  controlPts.push(new THREE.Vector3(Math.cos(a) * r, 0, Math.sin(a) * r));
}
const curve = new THREE.CatmullRomCurve3(controlPts, true, 'catmullrom', 0.5);
curve.arcLengthDivisions = 2000;
const TRACK_LEN = curve.getLength();

const SP = new Array(SEG), ST = new Array(SEG), SR = new Array(SEG);
for (let i = 0; i < SEG; i++) {
  const t = i / SEG;
  const p = curve.getPointAt(t);
  const tan = curve.getTangentAt(t).normalize();
  const r = new THREE.Vector3().crossVectors(tan, UP).normalize();
  SP[i] = p; ST[i] = tan; SR[i] = r;
}
const CURV = new Float32Array(SEG);
for (let i = 0; i < SEG; i++) CURV[i] = ST[i].angleTo(ST[(i + 1) % SEG]);

function makeRoadTexture() {
  const c = document.createElement('canvas');
  c.width = 256; c.height = 256;
  const x = c.getContext('2d');
  x.fillStyle = '#3c4149'; x.fillRect(0, 0, 256, 256);
  for (let i = 0; i < 2600; i++) {
    const g = Math.random() * 0.045;
    x.fillStyle = 'rgba(255,255,255,' + g.toFixed(3) + ')';
    x.fillRect(Math.random() * 256, Math.random() * 256, 2, 2);
  }
  x.fillStyle = '#eeeeee';
  x.fillRect(0, 0, 10, 256);
  x.fillRect(246, 0, 10, 256);
  x.fillStyle = '#d9d9d0';
  x.fillRect(83, 0, 6, 128);
  x.fillRect(167, 0, 6, 128);
  const tex = new THREE.CanvasTexture(c);
  tex.wrapS = THREE.ClampToEdgeWrapping;
  tex.wrapT = THREE.RepeatWrapping;
  tex.anisotropy = renderer.capabilities.getMaxAnisotropy();
  return tex;
}

(function buildRoad() {
  const pos = [], uv = [], idx = [];
  let acc = 0;
  for (let i = 0; i <= SEG; i++) {
    const k = i % SEG;
    const p = SP[k], r = SR[k];
    if (i > 0) acc += SP[k].distanceTo(SP[(k - 1 + SEG) % SEG]);
    pos.push(p.x - r.x * HALF_W, 0, p.z - r.z * HALF_W);
    pos.push(p.x + r.x * HALF_W, 0, p.z + r.z * HALF_W);
    uv.push(0, acc / 8, 1, acc / 8);
  }
  for (let i = 0; i < SEG; i++) {
    const a = i * 2;
    idx.push(a, a + 1, a + 2, a + 2, a + 1, a + 3);
  }
  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
  geo.setAttribute('uv', new THREE.Float32BufferAttribute(uv, 2));
  geo.setIndex(idx);
  geo.computeVertexNormals();

  const road = new THREE.Mesh(geo, new THREE.MeshStandardMaterial({
    map: makeRoadTexture(), roughness: 0.95, metalness: 0.0, side: THREE.DoubleSide
  }));
  road.receiveShadow = true;
  scene.add(road);

  const ground = new THREE.Mesh(
    new THREE.PlaneGeometry(3000, 3000),
    new THREE.MeshStandardMaterial({ color: 0x4d7d47, roughness: 1 })
  );
  ground.rotation.x = -Math.PI / 2;
  ground.position.y = -0.09;
  ground.receiveShadow = true;
  scene.add(ground);
})();

(function buildPosts() {
  const gap = 14;
  const perSide = Math.floor(TRACK_LEN / gap);
  const step = Math.max(1, Math.floor(SEG / perSide));
  const geo = new THREE.BoxGeometry(0.36, 1.05, 0.36);
  const matA = new THREE.MeshStandardMaterial({ color: 0xf2f2f2 });
  const matB = new THREE.MeshStandardMaterial({ color: 0xd94646 });
  const A = new THREE.InstancedMesh(geo, matA, Math.ceil(perSide * 2));
  const B = new THREE.InstancedMesh(geo, matB, Math.ceil(perSide * 2));
  A.castShadow = B.castShadow = true;

  const m = new THREE.Matrix4();
  let ia = 0, ib = 0, n = 0;
  for (let i = 0; i < SEG; i += step) {
    for (const side of [-1, 1]) {
      const p = SP[i], r = SR[i];
      m.makeTranslation(p.x + r.x * (HALF_W + 1.2) * side, 0.53, p.z + r.z * (HALF_W + 1.2) * side);
      if (n % 2 === 0) A.setMatrixAt(ia++, m); else B.setMatrixAt(ib++, m);
      n++;
    }
  }
  A.count = ia; B.count = ib;
  scene.add(A, B);
})();

(function buildTrees() {
  const COUNT = 340;
  const geo = new THREE.ConeGeometry(2.3, 7.5, 6);
  geo.translate(0, 3.75, 0);
  const mat = new THREE.MeshStandardMaterial({ color: 0x2e6b35, flatShading: true, roughness: 1 });
  const mesh = new THREE.InstancedMesh(geo, mat, COUNT);
  mesh.castShadow = true;

  const m = new THREE.Matrix4();
  const q = new THREE.Quaternion();
  const v = new THREE.Vector3();
  let placed = 0, tries = 0;
  while (placed < COUNT && tries < COUNT * 20) {
    tries++;
    const ti = (Math.random() * SEG) | 0;
    const p = SP[ti], r = SR[ti];
    const side = Math.random() < 0.5 ? -1 : 1;
    const off = HALF_W + 13 + Math.random() * 75;
    const x = p.x + r.x * off * side;
    const z = p.z + r.z * off * side;
    let ok = true;
    for (let j = 0; j < SEG; j += 3) {
      const dx = x - SP[j].x, dz = z - SP[j].z;
      if (dx * dx + dz * dz < 342) { ok = false; break; }
    }
    if (!ok) continue;
    const s = 0.75 + Math.random() * 0.9;
    v.set(x, 0, z);
    m.compose(v, q, new THREE.Vector3(s, s * (0.85 + Math.random() * 0.5), s));
    mesh.setMatrixAt(placed++, m);
  }
  mesh.count = placed;
  scene.add(mesh);
})();

// ============================================================
//  车辆模型
// ============================================================
function createCar(color) {
  const g = new THREE.Group();
  g.rotation.order = 'YXZ';

  const bodyMat = new THREE.MeshStandardMaterial({ color, roughness: 0.3, metalness: 0.55 });
  const darkMat = new THREE.MeshStandardMaterial({ color: 0x14181d, roughness: 0.7 });
  const glassMat = new THREE.MeshStandardMaterial({ color: 0x1b2c3d, roughness: 0.08, metalness: 0.95 });

  const base = new THREE.Mesh(new THREE.BoxGeometry(1.95, 0.42, 4.3), bodyMat);
  base.position.y = 0.52; base.castShadow = true; g.add(base);

  const nose = new THREE.Mesh(new THREE.BoxGeometry(1.84, 0.28, 1.15), bodyMat);
  nose.position.set(0, 0.44, 1.82); nose.castShadow = true; g.add(nose);

  const cabin = new THREE.Mesh(new THREE.BoxGeometry(1.6, 0.52, 1.9), glassMat);
  cabin.position.set(0, 0.96, -0.28); cabin.castShadow = true; g.add(cabin);

  const roof = new THREE.Mesh(new THREE.BoxGeometry(1.42, 0.13, 1.32), bodyMat);
  roof.position.set(0, 1.21, -0.33); g.add(roof);

  const wing = new THREE.Mesh(new THREE.BoxGeometry(1.92, 0.1, 0.5), darkMat);
  wing.position.set(0, 1.16, -2.0); wing.castShadow = true; g.add(wing);
  for (const sx of [-0.82, 0.82]) {
    const st = new THREE.Mesh(new THREE.BoxGeometry(0.1, 0.4, 0.4), darkMat);
    st.position.set(sx, 0.96, -2.0); g.add(st);
  }

  const wheelGeo = new THREE.CylinderGeometry(0.44, 0.44, 0.36, 14);
  wheelGeo.rotateZ(Math.PI / 2);
  const wheelMat = new THREE.MeshStandardMaterial({ color: 0x0d0d0f, roughness: 0.95 });
  const wheels = [];
  for (const [x, y, z] of [[-1.02, 0.44, 1.4], [1.02, 0.44, 1.4], [-1.02, 0.44, -1.4], [1.02, 0.44, -1.4]]) {
    const w = new THREE.Mesh(wheelGeo, wheelMat);
    w.position.set(x, y, z);
    w.castShadow = true;
    g.add(w); wheels.push(w);
  }

  const headMat = new THREE.MeshStandardMaterial({ color: 0xffffff, emissive: 0xffeaa0, emissiveIntensity: 3 });
  for (const sx of [-0.62, 0.62]) {
    const h = new THREE.Mesh(new THREE.BoxGeometry(0.48, 0.15, 0.1), headMat);
    h.position.set(sx, 0.62, 2.12); g.add(h);
  }
  const tailMat = new THREE.MeshStandardMaterial({ color: 0xff2222, emissive: 0xff1111, emissiveIntensity: 2.6 });
  for (const sx of [-0.7, 0.7]) {
    const t = new THREE.Mesh(new THREE.BoxGeometry(0.44, 0.13, 0.08), tailMat);
    t.position.set(sx, 0.74, -2.16); g.add(t);
  }
  return { group: g, wheels };
}

// ============================================================
//  漂移烟雾粒子
// ============================================================
const SMOKE_MAX = 260;
const smokePos = new Float32Array(SMOKE_MAX * 3);
const smokeAlpha = new Float32Array(SMOKE_MAX);
const smokeSize = new Float32Array(SMOKE_MAX);
for (let i = 0; i < SMOKE_MAX; i++) smokePos[i * 3 + 1] = -999;

const smokeGeo = new THREE.BufferGeometry();
smokeGeo.setAttribute('position', new THREE.BufferAttribute(smokePos, 3));
smokeGeo.setAttribute('alpha', new THREE.BufferAttribute(smokeAlpha, 1));
smokeGeo.setAttribute('psize', new THREE.BufferAttribute(smokeSize, 1));

const smokeMat = new THREE.ShaderMaterial({
  transparent: true, depthWrite: false,
  vertexShader: `
    attribute float alpha; attribute float psize;
    varying float vA;
    void main(){
      vA = alpha;
      vec4 mv = modelViewMatrix * vec4(position,1.0);
      gl_PointSize = psize * (330.0 / -mv.z);
      gl_Position = projectionMatrix * mv;
    }`,
  fragmentShader: `
    varying float vA;
    void main(){
      vec2 c = gl_PointCoord - vec2(0.5);
      float d = length(c);
      if(d > 0.5) discard;
      float a = smoothstep(0.5, 0.08, d) * vA;
      gl_FragColor = vec4(0.93, 0.95, 0.99, a * 0.72);
    }`
});
const smokePoints = new THREE.Points(smokeGeo, smokeMat);
smokePoints.frustumCulled = false;
scene.add(smokePoints);

const particles = [];
for (let i = 0; i < SMOKE_MAX; i++) particles.push({ life: 0, maxLife: 1, x: 0, y: -999, z: 0, vx: 0, vy: 0, vz: 0, size: 1 });
let pCursor = 0;

function emitSmoke(x, y, z) {
  const p = particles[pCursor];
  pCursor = (pCursor + 1) % SMOKE_MAX;
  p.maxLife = p.life = 0.7 + Math.random() * 0.45;
  p.x = x + (Math.random() - 0.5) * 0.7;
  p.y = y;
  p.z = z + (Math.random() - 0.5) * 0.7;
  p.vx = (Math.random() - 0.5) * 3.2;
  p.vy = 1.1 + Math.random() * 1.6;
  p.vz = (Math.random() - 0.5) * 3.2;
  p.size = 0.9 + Math.random() * 0.9;
}

function updateSmoke(dt) {
  for (let i = 0; i < SMOKE_MAX; i++) {
    const p = particles[i];
    if (p.life > 0) {
      p.life -= dt;
      p.x += p.vx * dt; p.y += p.vy * dt; p.z += p.vz * dt;
      p.vy -= 1.3 * dt;
      p.vx *= 0.96; p.vz *= 0.96;
      const k = Math.max(0, p.life / p.maxLife);
      smokePos[i * 3] = p.x;
      smokePos[i * 3 + 1] = p.y;
      smokePos[i * 3 + 2] = p.z;
      smokeAlpha[i] = k * k;
      smokeSize[i] = p.size * (1.9 - k * 0.9);
    } else {
      smokeAlpha[i] = 0;
      smokePos[i * 3 + 1] = -999;
    }
  }
  smokeGeo.attributes.position.needsUpdate = true;
  smokeGeo.attributes.alpha.needsUpdate = true;
  smokeGeo.attributes.psize.needsUpdate = true;
}

// ============================================================
//  车辆状态
// ============================================================
const playerCar = createCar(0xffd23f);
scene.add(playerCar.group);

const player = {
  group: playerCar.group,
  wheels: playerCar.wheels,
  x: 0, z: 0,
  vx: 0, vz: 0,
  heading: 0,
  vF: 0, vS: 0,
  roll: 0, pitch: 0,
  offTrack: false,
  drifting: false,
  // 转向状态（新增：两级惯性）
  steerAngle: 0,   // 当前方向盘角度 -1..1
  yawRate: 0,      // 当前偏航角速度 rad/s
};

const AI_COLORS = [0xe8453c, 0x3b82f6, 0x9b59b6];
const AIS = AI_COLORS.map((c, i) => {
  const car = createCar(c);
  scene.add(car.group);
  return {
    mesh: car.group, wheels: car.wheels,
    t: 0, speed: 0, maxSpeed: 44 + i * 2.2,
    offset: (i % 2 ? 1 : -1) * 4.2,
    phase: Math.random() * 10,
    x: 0, z: 0, lap: 0,
  };
});

// ============================================================
//  游戏状态
// ============================================================
const game = {
  running: false,
  finished: false,
  lap: 1, totalLaps: 3,
  time: 0, lapStart: 0, bestLap: null,
  lastIdx: 0, midPassed: false,
  nitro: 100,
  rank: 1,
};

const keys = Object.create(null);
window.addEventListener('keydown', e => {
  keys[e.code] = true;
  if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'Space'].includes(e.code)) e.preventDefault();
  if (e.code === 'KeyR' && game.finished) startRace();
});
window.addEventListener('keyup', e => { keys[e.code] = false; });
window.addEventListener('blur', () => { for (const k in keys) keys[k] = false; });

// ============================================================
//  触屏按钮 —— pointer capture，防误释放 / 防选中
// ============================================================
(function bindTouch() {
  const map = {
    tLeft: 'KeyA',
    tRight: 'KeyD',
    tGas: 'KeyW',
    tBrake: 'KeyS',
    tDrift: 'Space',
    tNitro: 'ShiftLeft'
  };

  for (const id in map) {
    const el = document.getElementById(id);
    if (!el) continue;
    const code = map[id];

    const press = e => {
      e.preventDefault();
      e.stopPropagation();
      try { el.setPointerCapture(e.pointerId); } catch (_) {}
      keys[code] = true;
      el.classList.add('active');
    };

    const release = e => {
      if (e) { e.preventDefault(); e.stopPropagation(); }
      keys[code] = false;
      el.classList.remove('active');
    };

    el.addEventListener('pointerdown', press, { passive: false });
    el.addEventListener('pointerup', release, { passive: false });
    el.addEventListener('pointercancel', release, { passive: false });
    el.addEventListener('lostpointercapture', release);
    el.addEventListener('touchstart', e => e.preventDefault(), { passive: false });
    el.addEventListener('touchend', e => e.preventDefault(), { passive: false });
    el.addEventListener('touchmove', e => e.preventDefault(), { passive: false });
  }
})();

['touchstart', 'touchmove', 'touchend'].forEach(ev => {
  glCanvas.addEventListener(ev, e => e.preventDefault(), { passive: false });
});
glCanvas.addEventListener('pointerdown', e => e.preventDefault(), { passive: false });

// ============================================================
//  工具
// ============================================================
function findNearest(x, z, from) {
  let best = from, bestD = Infinity;
  for (let i = -90; i <= 90; i++) {
    const k = (from + i + SEG) % SEG;
    const dx = x - SP[k].x, dz = z - SP[k].z;
    const d = dx * dx + dz * dz;
    if (d < bestD) { bestD = d; best = k; }
  }
  return best;
}

function sampleAt(t) {
  const ft = (t % 1 + 1) % 1 * SEG;
  const i0 = Math.floor(ft) % SEG, i1 = (i0 + 1) % SEG;
  const f = ft - Math.floor(ft);
  const px = SP[i0].x + (SP[i1].x - SP[i0].x) * f;
  const pz = SP[i0].z + (SP[i1].z - SP[i0].z) * f;
  let tx = ST[i0].x + (ST[i1].x - ST[i0].x) * f;
  let tz = ST[i0].z + (ST[i1].z - ST[i0].z) * f;
  const L = Math.hypot(tx, tz) || 1; tx /= L; tz /= L;
  return { px, pz, tx, tz };
}

// ============================================================
//  重置比赛
// ============================================================
function startRace() {
  const t0 = 0.008;
  const i0 = Math.floor(t0 * SEG);
  player.x = SP[i0].x;
  player.z = SP[i0].z;
  player.heading = Math.atan2(ST[i0].x, ST[i0].z);
  player.vx = 0; player.vz = 0;
  player.vF = 0; player.vS = 0;
  player.roll = 0; player.pitch = 0;
  player.steerAngle = 0;
  player.yawRate = 0;

  game.running = true;
  game.finished = false;
  game.lap = 1;
  game.time = 0;
  game.lapStart = 0;
  game.bestLap = null;
  game.lastIdx = i0;
  game.midPassed = false;
  game.nitro = 100;

  AIS.forEach((ai, i) => {
    ai.t = 0.018 + i * 0.009;
    ai.speed = 0;
    ai.lap = 0;
    ai.offset = (i % 2 ? 1 : -1) * 4.2;
    ai.mesh.visible = true;
  });

  for (let i = 0; i < SMOKE_MAX; i++) { particles[i].life = 0; smokeAlpha[i] = 0; }
  document.getElementById('overlay').classList.add('hide');
}

function finishRace() {
  game.running = false;
  game.finished = true;
  const el = document.getElementById('overlay');
  el.querySelector('h1').textContent = '比 赛 结 束';
  const res = document.getElementById('result');
  res.style.display = 'block';
  res.innerHTML = `最终名次 <b>第 ${game.rank} 名 / 4</b><br>
                   总用时 <b>${fmtTime(game.time)}</b><br>
                   最佳单圈 <b>${game.bestLap ? fmtTime(game.bestLap) : '--'}</b>`;
  document.getElementById('startBtn').textContent = '再来一局';
  el.classList.remove('hide');
}

function fmtTime(s) {
  const m = Math.floor(s / 60);
  const sec = (s % 60).toFixed(2).padStart(5, '0');
  return m > 0 ? `${m}:${sec}` : `${sec}s`;
}

// ============================================================
//  玩家物理
// ============================================================
const MAX_SPEED = 78;
const ENGINE = 22;
const BRAKE_POWER = 34;
const LINEAR_DRAG = 0.10;

function updatePlayer(dt) {
  const p = player;

  const throttle = keys.KeyW || keys.ArrowUp;
  const brake = keys.KeyS || keys.ArrowDown;
  const steerL = keys.KeyA || keys.ArrowLeft;
  const steerR = keys.KeyD || keys.ArrowRight;
  const handbrake = keys.Space;
  const nitroKey = (keys.ShiftLeft || keys.ShiftRight) && game.nitro > 0.5;

  const fx0 = Math.sin(p.heading), fz0 = Math.cos(p.heading);
  const vF0 = p.vx * fx0 + p.vz * fz0;
  const spAbs = Math.abs(vF0);

  // ---------- ① 方向盘：输入平滑（打方向有过渡，回正更快） ----------
  const steerTarget = (steerL ? 1 : 0) - (steerR ? 1 : 0);
  {
    const returning = Math.abs(steerTarget) < Math.abs(p.steerAngle);
    const rate = returning ? 7.0 : 4.5;    // 打满约 0.22s，回正约 0.14s
    const diff = steerTarget - p.steerAngle;
    const step = rate * dt;
    if (Math.abs(diff) <= step) p.steerAngle = steerTarget;
    else p.steerAngle += Math.sign(diff) * step;
  }

  // ---------- ② 转向权威曲线：低速弱、高速沉 ----------
  const lowSpeedRamp = THREE.MathUtils.smoothstep(spAbs, 1.0, 13.0);   // 停车/极低速几乎不转
  const highSpeedDamp = 1 / (1 + Math.max(0, spAbs - 16) * 0.013);      // 高速转向变"重"
  let maxYaw = 1.6 * lowSpeedRamp * highSpeedDamp;
  if (handbrake) maxYaw *= 1.5;

  // ---------- ③ 偏航角速度惯性：车头旋转不是瞬时的 ----------
  const targetYawRate = p.steerAngle * maxYaw * Math.sign(vF0 || 1);
  const yawResponse = handbrake ? 4.5 : 6.0;
  p.yawRate += (targetYawRate - p.yawRate) * Math.min(1, dt * yawResponse);
  p.heading += p.yawRate * dt;

  // ---------- 速度分解 / 纵向力 ----------
  const fx = Math.sin(p.heading), fz = Math.cos(p.heading);
  const sx = Math.cos(p.heading), sz = -Math.sin(p.heading);
  let vF = p.vx * fx + p.vz * fz;
  let vS = p.vx * sx + p.vz * sz;

  let accel = 0;
  if (throttle) accel += ENGINE * Math.max(0, 1 - Math.max(0, vF) / MAX_SPEED);
  if (nitroKey) {
    accel += 26 * Math.max(0, 1 - Math.max(0, vF) / (MAX_SPEED * 1.18));
    game.nitro = Math.max(0, game.nitro - 30 * dt);
  }
  if (brake) {
    if (vF > 0.4) accel -= BRAKE_POWER;
    else accel -= 9;
  }
  accel -= vF * LINEAR_DRAG;
  vF += accel * dt;
  if (vF > 96) vF = 96;
  if (vF < -14) vF = -14;

  // ---------- 横向抓地 ----------
  const isDrift = handbrake && Math.abs(vF) > 8;
  const grip = isDrift ? 2.1 : 11.5;
  vS *= Math.exp(-grip * dt);

  p.vx = vF * fx + vS * sx;
  p.vz = vF * fz + vS * sz;
  p.vF = vF; p.vS = vS;
  p.drifting = isDrift && Math.abs(vS) > 2.2;

  // ---------- 位移 ----------
  p.x += p.vx * dt;
  p.z += p.vz * dt;

  // ---------- 赛道约束 ----------
  const idx = findNearest(p.x, p.z, game.lastIdx);
  const dx = p.x - SP[idx].x, dz = p.z - SP[idx].z;
  const lateral = dx * SR[idx].x + dz * SR[idx].z;
  const over = Math.abs(lateral) - (HALF_W - 0.6);

  p.offTrack = over > 0;
  if (over > 0) {
    const slow = Math.exp(-1.5 * dt);
    p.vx *= slow; p.vz *= slow;
  }
  if (Math.abs(lateral) > HALF_W + 5.5) {
    const push = Math.abs(lateral) - (HALF_W + 5.5);
    const sg = Math.sign(lateral);
    p.x -= SR[idx].x * push * sg;
    p.z -= SR[idx].z * push * sg;
    const vOut = p.vx * SR[idx].x * sg + p.vz * SR[idx].z * sg;
    if (vOut > 0) {
      p.vx -= SR[idx].x * sg * vOut;
      p.vz -= SR[idx].z * sg * vOut;
    }
  }

  // ---------- 圈数检测 ----------
  if (idx > SEG * 0.45 && idx < SEG * 0.56) game.midPassed = true;
  if (game.lastIdx > SEG * 0.82 && idx < SEG * 0.18 && game.midPassed) {
    const lapT = game.time - game.lapStart;
    game.lapStart = game.time;
    if (!game.bestLap || lapT < game.bestLap) game.bestLap = lapT;
    game.lap++;
    game.midPassed = false;
    if (game.lap > game.totalLaps) { game.lap = game.totalLaps; finishRace(); }
  }
  game.lastIdx = idx;

  // ---------- 漂移充能 ----------
  if (p.drifting) game.nitro = Math.min(100, game.nitro + 20 * dt);

  // ---------- 视觉 ----------
  const g = p.group;
  g.position.set(p.x, 0, p.z);
  g.rotation.y = p.heading;

  // 车身侧倾用平滑后的方向盘角度，转弯不再是"啪"一下
  const targetRoll = -p.steerAngle * Math.min(1, spAbs / 40) * (isDrift ? 0.11 : 0.055);
  const targetPitch = (brake ? 0.035 : 0) - (throttle ? 0.018 : 0);
  p.roll += (targetRoll - p.roll) * Math.min(1, dt * 8);
  p.pitch += (targetPitch - p.pitch) * Math.min(1, dt * 6);
  g.rotation.z = p.roll;
  g.rotation.x = p.pitch;

  // 前轮视觉转角跟随平滑方向盘
  const wheelSteer = p.steerAngle * 0.45;
  p.wheels[0].rotation.y = wheelSteer;
  p.wheels[1].rotation.y = wheelSteer;

  // 烟雾
  if (p.drifting || (p.offTrack && spAbs > 6)) {
    const rx = fx * -1.4, rz = fz * -1.4;
    const emit = Math.ceil(Math.abs(vS) * 0.9) + 1;
    for (let i = 0; i < emit; i++) {
      emitSmoke(p.x + rx + sx * (Math.random() - 0.5) * 1.8, 0.35,
                p.z + rz + sz * (Math.random() - 0.5) * 1.8);
    }
  }
}

// ============================================================
//  AI
// ============================================================
function updateAI(dt) {
  for (const ai of AIS) {
    const tMod = ((ai.t % 1) + 1) % 1;
    const k = Math.floor(tMod * SEG) % SEG;

    const c = CURV[k];
    const target = ai.maxSpeed * THREE.MathUtils.clamp(1.1 - c * 26, 0.42, 1);
    ai.speed += (target - ai.speed) * Math.min(1, dt * 1.8);
    ai.t += ai.speed * dt / TRACK_LEN;

    const s = sampleAt(ai.t);
    const off = ai.offset + Math.sin(game.time * 0.8 + ai.phase) * 1.6;
    const rx = -s.tz, rz = s.tx;

    ai.x = s.px + rx * off;
    ai.z = s.pz + rz * off;

    ai.mesh.position.set(ai.x, 0, ai.z);
    ai.mesh.rotation.y = Math.atan2(s.tx, s.tz);

    const steerVis = Math.sin(game.time * 0.8 + ai.phase) * 0.06;
    ai.wheels[0].rotation.y = steerVis;
    ai.wheels[1].rotation.y = steerVis;

    const ddx = player.x - ai.x, ddz = player.z - ai.z;
    const d2 = ddx * ddx + ddz * ddz;
    if (d2 < 9.6) {
      const d = Math.sqrt(d2) || 0.01;
      const nx = ddx / d, nz = ddz / d;
      const push = (3.1 - d) * 0.55;
      player.x += nx * push;
      player.z += nz * push;
      player.vx *= 0.93; player.vz *= 0.93;
    }
  }
}

// ============================================================
//  排名
// ============================================================
function computeRank() {
  const playerProg = (game.lap - 1) + (game.lastIdx / SEG);
  let rank = 1;
  for (const ai of AIS) {
    const aiProg = Math.floor(ai.t) + ((ai.t % 1 + 1) % 1);
    if (aiProg > playerProg) rank++;
  }
  game.rank = rank;
}

// ============================================================
//  相机
// ============================================================
const camTarget = new THREE.Vector3();
const camLook = new THREE.Vector3();

function updateCamera(dt) {
  const h = player.heading;
  const fx = Math.sin(h), fz = Math.cos(h);
  const speedK = Math.min(1, Math.abs(player.vF) / 85);

  const back = 10.5 + speedK * 2.4;
  const height = 4.5 + speedK * 0.9;

  camTarget.set(player.x - fx * back, height, player.z - fz * back);

  if (player.drifting) {
    const vlen = Math.hypot(player.vx, player.vz);
    if (vlen > 1) {
      const vfx = player.vx / vlen, vfz = player.vz / vlen;
      camTarget.x -= vfx * 1.6;
      camTarget.z -= vfz * 1.6;
    }
  }

  camera.position.lerp(camTarget, 1 - Math.exp(-7.5 * dt));

  camLook.set(player.x + fx * 9, 1.9, player.z + fz * 9);
  camera.lookAt(camLook);

  const targetFov = 62 + speedK * 17;
  camera.fov += (targetFov - camera.fov) * Math.min(1, dt * 5);
  camera.updateProjectionMatrix();

  sun.position.set(player.x + 70, 130, player.z + 50);
  sun.target.position.set(player.x, 0, player.z);
  sun.target.updateMatrixWorld();
}

// ============================================================
//  小地图
// ============================================================
const mapCanvas = document.getElementById('minimap');
const mctx = mapCanvas.getContext('2d');
const MAP_W = 152, MAP_DPR = 2;
mctx.scale(MAP_DPR, MAP_DPR);

let mapScale = 1, mapOX = 0, mapOZ = 0;
(function initMap() {
  let minX = Infinity, maxX = -Infinity, minZ = Infinity, maxZ = -Infinity;
  for (const p of SP) {
    if (p.x < minX) minX = p.x;
    if (p.x > maxX) maxX = p.x;
    if (p.z < minZ) minZ = p.z;
    if (p.z > maxZ) maxZ = p.z;
  }
  const pad = 18;
  const w = maxX - minX, h = maxZ - minZ;
  mapScale = Math.min((MAP_W - pad * 2) / w, (MAP_W - pad * 2) / h);
  mapOX = (MAP_W - w * mapScale) / 2 - minX * mapScale;
  mapOZ = (MAP_W - h * mapScale) / 2 - minZ * mapScale;
})();

function mx(x) { return x * mapScale + mapOX; }
function mz(z) { return z * mapScale + mapOZ; }

function drawMap() {
  mctx.clearRect(0, 0, MAP_W, MAP_W);

  mctx.beginPath();
  for (let i = 0; i <= SEG; i += 4) {
    const k = i % SEG;
    const x = mx(SP[k].x), y = mz(SP[k].z);
    if (i === 0) mctx.moveTo(x, y); else mctx.lineTo(x, y);
  }
  mctx.closePath();
  mctx.strokeStyle = 'rgba(110,180,255,.45)';
  mctx.lineWidth = 6;
  mctx.lineJoin = 'round';
  mctx.stroke();

  mctx.strokeStyle = 'rgba(160,215,255,.9)';
  mctx.lineWidth = 1.6;
  mctx.stroke();

  for (const ai of AIS) {
    mctx.beginPath();
    mctx.arc(mx(ai.x), mz(ai.z), 3.4, 0, Math.PI * 2);
    mctx.fillStyle = '#ff6b6b';
    mctx.fill();
  }

  mctx.beginPath();
  mctx.arc(mx(player.x), mz(player.z), 4.6, 0, Math.PI * 2);
  mctx.fillStyle = '#ffd23f';
  mctx.fill();
  mctx.strokeStyle = '#000';
  mctx.lineWidth = 1.2;
  mctx.stroke();
}

// ============================================================
//  HUD
// ============================================================
const elSpeed = document.getElementById('speedVal');
const elGear = document.getElementById('gearTag');
const elLap = document.getElementById('lapTxt');
const elPos = document.getElementById('posTxt');
const elCur = document.getElementById('curTxt');
const elBest = document.getElementById('bestTxt');
const elNitro = document.getElementById('nitroFill');
const elDrift = document.getElementById('driftTag');
const elWarn = document.getElementById('warn');
const elVig = document.getElementById('vignette');
const elNitroBtn = document.getElementById('tNitro');

let hudTick = 0;
let nitroDisabled = false;

function updateHUD(dt) {
  hudTick += dt;
  const kmh = Math.round(Math.abs(player.vF) * 3.6);
  elSpeed.textContent = kmh;

  let gear = '';
  if (kmh > 200) gear = 'MAX SPEED';
  else if (kmh > 140) gear = 'HIGH';
  else if (kmh > 60) gear = 'CRUISE';
  elGear.textContent = gear;

  elNitro.style.width = game.nitro.toFixed(1) + '%';
  elDrift.classList.toggle('on', player.drifting);
  elWarn.style.opacity = (player.offTrack && Math.abs(player.vF) > 4) ? '1' : '0';
  elVig.style.opacity = player.offTrack ? '1' : '0';

  const shouldDisable = game.nitro < 1;
  if (shouldDisable !== nitroDisabled) {
    nitroDisabled = shouldDisable;
    elNitroBtn.classList.toggle('disabled', shouldDisable);
  }

  if (hudTick > 0.06) {
    hudTick = 0;
    elLap.textContent = `${Math.min(game.lap, game.totalLaps)}/${game.totalLaps}`;
    elPos.textContent = `${game.rank}/4`;
    elCur.textContent = (game.time - game.lapStart).toFixed(2);
    elBest.textContent = game.bestLap ? game.bestLap.toFixed(2) : '--';
  }
}

// ============================================================
//  主循环
// ============================================================
let lastTime = performance.now();

function loop(now) {
  requestAnimationFrame(loop);
  const dt = Math.min(0.05, (now - lastTime) / 1000);
  lastTime = now;

  if (game.running) {
    game.time += dt;
    updatePlayer(dt);
    updateAI(dt);
    computeRank();
  }

  updateSmoke(dt);
  updateCamera(dt);
  drawMap();
  updateHUD(dt);

  renderer.render(scene, camera);
}

// ============================================================
//  启动
// ============================================================
window.addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

document.getElementById('startBtn').addEventListener('click', startRace);

(function initialPose() {
  const i0 = Math.floor(0.008 * SEG);
  player.x = SP[i0].x;
  player.z = SP[i0].z;
  player.heading = Math.atan2(ST[i0].x, ST[i0].z);
  player.group.position.set(player.x, 0, player.z);
  player.group.rotation.y = player.heading;
  game.lastIdx = i0;
  camera.position.set(player.x - Math.sin(player.heading) * 12, 6, player.z - Math.cos(player.heading) * 12);
  camera.lookAt(player.x, 1.5, player.z);
})();

requestAnimationFrame(loop);

})();
